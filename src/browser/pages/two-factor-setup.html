<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="style-src 'self'; script-src 'self' 'unsafe-inline'; manifest-src 'self'; img-src 'self' data:; font-src 'self' data:;"
    />
    <meta name="color-scheme" content="light dark" />
    <title>{{I18N_SETUP_TITLE}}</title>
    <link rel="icon" href="{{CS_STATIC_BASE}}/src/browser/media/favicon-dark-support.svg" />
    <link rel="alternate icon" href="{{CS_STATIC_BASE}}/src/browser/media/favicon.ico" />
    <link rel="manifest" href="{{BASE}}/manifest.json" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" sizes="192x192" href="{{CS_STATIC_BASE}}/src/browser/media/pwa-icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="{{CS_STATIC_BASE}}/src/browser/media/pwa-icon-512.png" />
    <link href="{{CS_STATIC_BASE}}/src/browser/pages/global.css" rel="stylesheet" />
    <link href="{{CS_STATIC_BASE}}/src/browser/pages/login.css" rel="stylesheet" />
    <link href="{{CS_STATIC_BASE}}/src/browser/pages/two-factor-setup.css" rel="stylesheet" />
    <meta id="coder-options" data-settings="{{OPTIONS}}" />
  </head>
  <body>
    <div class="center-container">
      <div class="card-box">
        <div class="header">
          <h1 class="main">{{I18N_SETUP_TITLE}}</h1>
          <div class="sub">{{I18N_SETUP_INTRO}}</div>
        </div>
        <div class="content">
          <div class="totp-setup">
            <img class="totp-qr" src="{{QR_DATA_URI}}" alt="TOTP QR code" width="220" height="220" />
            <div class="totp-secret">
              <span class="label">{{I18N_SETUP_SECRET_LABEL}}</span>
              <code>{{TOTP_SECRET}}</code>
            </div>
            <div class="totp-env-note">{{I18N_SETUP_ENV_NOTE}}</div>
          </div>
          <form class="login-form" method="post">
            <input id="base" type="hidden" name="base" value="{{BASE}}" />
            <input id="href" type="hidden" name="href" value="" />
            <input type="hidden" name="setup-token" value="{{SETUP_TOKEN}}" />
            <div class="totp-confirm-label">{{I18N_SETUP_CONFIRM_LABEL}}</div>
            <div class="field">
              <input
                required
                autofocus
                class="password"
                type="text"
                placeholder="{{I18N_TOTP_PLACEHOLDER}}"
                name="code"
                autocomplete="one-time-code"
                inputmode="numeric"
                maxlength="8"
              />
              <input class="submit -button" value="{{I18N_SETUP_SUBMIT}}" type="submit" />
            </div>
            {{ERROR}}
          </form>
        </div>
      </div>
    </div>
    <script>
      // Inform the backend about the path since the proxy might have rewritten
      // it out of the headers and cookies must be set with absolute paths.
      const el = document.getElementById("href")
      if (el) {
        el.value = location.href
      }
    </script>
  </body>
</html>
